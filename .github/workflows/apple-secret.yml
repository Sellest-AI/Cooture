# Re-signs the Sign in with Apple client secret and sets it on both Convex deployments.
#
# Apple refuses a client secret older than six months, and an expired one fails every Apple
# sign-in with nothing else noticing (it happened on 2026-09-11). Running on the 1st of every
# other month means a failed run still leaves four months, and two more runs, before it lapses.
#
# Secrets: APPLE_SIGN_IN_KEY is the contents of AuthKey_J7KDKDHS4A.p8. CONVEX_ENV_KEY_DEV and
# CONVEX_ENV_KEY_PROD are Convex deploy keys carrying `deployment:env:write` only.
#
# GitHub runs a schedule from the default branch only, and pauses it after 60 days without a
# commit to the repository; re-enable it from the Actions tab if that happens.
name: Apple secret

on:
  schedule:
    - cron: "0 5 1 */2 *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sign the secret
        id: sign
        env:
          APPLE_SIGN_IN_KEY: ${{ secrets.APPLE_SIGN_IN_KEY }}
        run: |
          secret="$(node scripts/apple-client-secret.mjs)"
          echo "::add-mask::$secret"
          echo "secret=$secret" >> "$GITHUB_OUTPUT"

      # `npx` without an install: cooture's postinstall builds Skia, which this job has no use for.
      - name: Set on dev
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_ENV_KEY_DEV }}
          SECRET: ${{ steps.sign.outputs.secret }}
        run: npx --yes convex@1 env set AUTH_APPLE_SECRET "$SECRET"

      - name: Set on prod
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_ENV_KEY_PROD }}
          SECRET: ${{ steps.sign.outputs.secret }}
        run: npx --yes convex@1 env set AUTH_APPLE_SECRET "$SECRET"
